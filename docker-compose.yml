# Standalone deployment: `docker compose up -d --build`, then open
# http://localhost:3000. Copy .env.example to .env and fill in your accounts
# first. For a reverse-proxied setup (e.g. Traefik), add the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
services:
  infovore:
    build: .
    image: infovore
    container_name: infovore
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/data/infovore.sqlite
    volumes:
      - infovore-data:/data
  ingest:
    build: .
    image: infovore
    container_name: infovore-ingest
    command: ["npx", "tsx", "src/ingest.ts"]
    # Configuration health; the image's healthcheck is the web app's readiness.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file: .env
    ports:
      - "${INGEST_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - DATABASE_PATH=/data/infovore.sqlite
    volumes:
      - infovore-data:/data

volumes:
  infovore-data:
